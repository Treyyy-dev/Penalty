<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penalty</title>
<style>html,body{margin:0;height:100%;background:#050507}body{display:flex;align-items:center;justify-content:center;color:#c9161b;font:30px Georgia,serif;letter-spacing:8px;text-align:center}small{display:block;font:13px Arial,sans-serif;letter-spacing:1px;color:#999;margin-top:14px}</style>
</head>
<body><div id="l">PENALTY<small id="m">Loading...</small></div>
<script>
// This page only picks which build of the game to open, then opens it.
//  - Players get the build the developer last released from the in-game studio.
//  - Until a first release exists, everyone gets the newest build.
// const BUILD='99990000000000'  (lets copies of the game from before this loader notice it and reload)
(async function(){
  var PID='penalty-de8db';
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  async function json(u,ms){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);try{var r=await fetch(u,{cache:'no-store',signal:c.signal});if(r.status===404)return 404;if(!r.ok)throw new Error('http');return await r.json()}finally{clearTimeout(t)}}
  var rel=null,idx=null;
  try{var d=await json('https://firestore.googleapis.com/v1/projects/'+PID+'/databases/(default)/documents/config/release',5000);
    if(d===404)rel={build:'',content:[]};
    else if(d&&d.fields){var arr=function(k){return ((((d.fields[k]||{}).arrayValue||{}).values)||[]).map(function(v){return v.stringValue||''})};rel={build:(d.fields.build||{}).stringValue||'',content:arr('content'),shop:arr('shop')};set('penalty_rel',JSON.stringify(rel))}
  }catch(e){try{rel=JSON.parse(get('penalty_rel'))}catch(e2){}}
  try{idx=await json('builds/index.json?t='+Date.now(),8000)}catch(e){}
  var ids=idx&&idx.builds&&idx.builds.map?idx.builds.map(function(b){return b.id}):[],latest=ids[ids.length-1]||'';
  var dev=get('penalty_dev')==='1',released=rel&&rel.build||'';
  // the released build is used even if the build list is out of date (the web host can serve an old copy for a few minutes)
  if(released&&latest<released)latest=released;
  var cur=get('penalty_cur');
  // players stay on their build until they update, and never go past the release
  var target=dev||!released?latest:(cur&&cur<=released?cur:released);
  if(!dev&&released&&target!==cur)set('penalty_cur',target);
  if(rel&&!released&&!dev&&latest)set('penalty_cur',latest);
  var fail=function(){document.getElementById('m').textContent='Could not load the game. Tap to try again.';document.body.onclick=function(){location.reload()}};
  if(!target){fail();return}
  var tries=[target,released,latest].filter(function(v,i,a){return v&&a.indexOf(v)===i}),html=null,got='';
  for(var i=0;i<tries.length&&!html;i++){try{var r=await fetch('builds/'+tries[i]+'.html?t='+Date.now(),{cache:'no-store'});if(r.ok){html=await r.text();got=tries[i]}}catch(e){}}
  if(!html){fail();return}
  if(got!==target&&!dev)set('penalty_cur',got);
  try{
    var REL={build:released,content:rel&&rel.content||[],shop:rel&&rel.shop||[],latest:latest,dev:dev};
    html=html.replace('<script>','<script>window.REL='+JSON.stringify(REL).replace(/</g,'\\u003c')+';<\/script><script>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('m').textContent='Could not load the game. Tap to try again.';document.body.onclick=function(){location.reload()}}
})();
</script>
</body>
</html>
